services:
  app:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: phinisi-app_php
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    networks:
      - phinisi-app_net
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: phinisi-app_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: phinisi-app
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d
    networks:
      - phinisi-app_net

  web:
    image: nginx:alpine
    container_name: phinisi-app_web
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - phinisi-app_net

volumes:
  db_data:

networks:
  phinisi-app_net:
    driver: bridge
